<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/escudo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B3D91" />
  <meta name="description"
    content="Club Aridane — Pasión, esfuerzo y tradición desde 1946. Sigue los partidos, conoce nuestra plantilla y hazte socio." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Club Aridane" />
  <meta property="og:locale" content="es_ES" />
  <title>Club de Lucha Canaria Aridane</title>
</head>

<body>
  <!-- Script anti-flash: aplica la clase dark ANTES de que React renderice -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('aridane-theme');
        if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
